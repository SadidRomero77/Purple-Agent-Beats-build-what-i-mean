[project]
name = "purple-agent-v2-bwim"
version = "2.0.0"
description = "Purple Agent v2 for Build What I Mean — AgentBeats competition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "a2a-sdk>=0.2.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
