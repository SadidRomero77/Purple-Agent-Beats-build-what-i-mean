[project]
name = "purple-agent-v3-bwim"
version = "3.0.0"
description = "Purple Agent v3 for Build What I Mean — AgentBeats competition (BAML-powered)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "a2a-sdk[http-server]>=0.3.20",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "baml-py>=0.220.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
